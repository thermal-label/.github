name: Feature request
description: Suggest a new feature or improvement to an existing one.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open this on the repository that owns the package the feature would live in.
        For ideas that span several packages, open it on `thermal-label/.github`.

  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe the feature or improvement clearly.
      placeholder: "e.g. A `copies` option in printText that repeats the job without reconnecting…"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What problem does it solve? Who benefits, and in what context?
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Relevant package
      description: "Full npm name, or `Not sure / multiple` if it spans the ecosystem."
      placeholder: "@thermal-label/<package>"

  - type: textarea
    id: api
    attributes:
      label: Proposed API or behaviour
      description: If relevant, sketch what the call site might look like.
      render: typescript

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other ways to achieve the same thing.
